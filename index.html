<!doctype html>
<html lang="es">
  <head>

    <title>Oro Liquido | Catalogo</title>

      body {

        display: grid; 
        place-items: center; 
        background-color: #ffffff; 
        color: #000000; 
        font-family: Arial, sans-serif; 
        text-align: center; 
      }
      .content { 
        padding: 32px 28px; 
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-width: 90%;
        width: 360px;
      }
      h1 { 
        margin: 0 0 14px; 
        font-size: 22px; 
        letter-spacing: .15em; 
        color: #000000;
        font-weight: 800;
      }
      p { 
        color: #222222; 
        font-size: 15px;
        margin-bottom: 20px;
      }
      a { 
        display: inline-block;
        color: #ffffff; 
        background-color: #000000;
        padding: 12px 20px;
        border-radius: 6px;
        font-weight: 700; 
        text-decoration: none;
        border: 1px solid #000000;
        transition: all 0.2s ease;
      }
      a:hover {
        background-color: #ffffff;
        color: #000000;
      }
